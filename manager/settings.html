<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · Crewline</title>
  <meta name="description" content="Crewline manager console — settings">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/shell.css">
  <link rel="stylesheet" href="../assets/css/manager.css">
  <script type="module" src="../assets/vendor/ionicons/ionicons.esm.js"></script>
  <script nomodule src="../assets/vendor/ionicons/ionicons.js"></script>
</head>
<body data-app="manager" data-page="settings">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page">
        <div class="page-head" data-reveal>
          <div><h1>Settings</h1><p class="sub">Company, locations, positions, kiosk and notifications</p></div>
        </div>
        <div class="settings">
          <nav class="card settings-nav" id="settingsNav" data-reveal>
            <button class="active" data-panel="company"><ion-icon name="business-outline"></ion-icon>Company</button>
            <button data-panel="locations"><ion-icon name="location-outline"></ion-icon>Locations</button>
            <button data-panel="positions"><ion-icon name="briefcase-outline"></ion-icon>Positions &amp; pay</button>
            <button data-panel="kiosk"><ion-icon name="tablet-landscape-outline"></ion-icon>Kiosk</button>
            <button data-panel="notifications"><ion-icon name="notifications-outline"></ion-icon>Notifications</button>
            <button data-panel="demo"><ion-icon name="sparkles-outline"></ion-icon>Demo data</button>
          </nav>
          <div id="panels" data-reveal></div>
        </div>
      </main>
    </div>
  </div>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/shell.js"></script>
  <script src="../assets/js/pages/manager-settings.js"></script>
</body>
</html>
